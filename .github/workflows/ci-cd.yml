name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write # needed for the OIDC login to Azure
  contents: read

env:
  WEB_APP_NAME: app-chargetags-9496

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: dotnet test

      - name: Publish
        run: dotnet publish src/ChargeTags.Api --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  # Only runs for pushes to main, not for pull requests
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: publish
