<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1160" height="500" fill="#ffffff"/>

  <text x="580" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">The story of one charge tag</text>
  <text x="580" y="75" text-anchor="middle" font-size="16" fill="#555">How the three endpoints are used in real life</text>

  <rect x="40" y="110" width="250" height="330" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="72" cy="142" r="18" fill="#2563eb"/>
  <text x="72" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1</text>
  <text x="100" y="149" font-size="18" font-weight="bold" fill="#111">Kim gets a tag</text>
  <text x="58" y="195" font-size="14" fill="#333">Kim becomes a Clever customer.</text>
  <text x="58" y="217" font-size="14" fill="#333">Clever registers Kim's new tag</text>
  <text x="58" y="239" font-size="14" fill="#333">before sending it.</text>
  <rect x="58" y="300" width="214" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="70" y="320" font-size="12" fill="#555">Create</text>
  <text x="70" y="339" font-size="13" fill="#1e3a8a" font-family="Consolas, monospace">POST /api/chargetags</text>
  <rect x="58" y="370" width="214" height="44" rx="22" fill="#dcfce7" stroke="#16a34a"/>
  <text x="165" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">201 · Tag created</text>

  <rect x="310" y="110" width="250" height="330" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="342" cy="142" r="18" fill="#2563eb"/>
  <text x="342" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <text x="370" y="149" font-size="18" font-weight="bold" fill="#111">Kim charges</text>
  <text x="328" y="195" font-size="14" fill="#333">Kim holds the tag to a charger.</text>
  <text x="328" y="217" font-size="14" fill="#333">The charger asks the API:</text>
  <text x="328" y="239" font-size="14" font-style="italic" fill="#333">"May this tag charge?"</text>
  <rect x="328" y="300" width="214" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="340" y="320" font-size="12" fill="#555">Verify</text>
  <text x="340" y="339" font-size="13" fill="#1e3a8a" font-family="Consolas, monospace">GET .../verify?tagId=</text>
  <rect x="328" y="370" width="214" height="44" rx="22" fill="#dcfce7" stroke="#16a34a"/>
  <text x="435" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Yes · charging starts</text>

  <rect x="580" y="110" width="250" height="330" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="612" cy="142" r="18" fill="#2563eb"/>
  <text x="612" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
  <text x="640" y="149" font-size="18" font-weight="bold" fill="#111">Kim loses the tag</text>
  <text x="598" y="195" font-size="14" fill="#333">Kim calls Clever, and Clever</text>
  <text x="598" y="217" font-size="14" fill="#333">blocks the tag, so nobody else</text>
  <text x="598" y="239" font-size="14" fill="#333">can use it.</text>
  <rect x="598" y="300" width="214" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="610" y="320" font-size="12" fill="#555">Block</text>
  <text x="610" y="339" font-size="13" fill="#1e3a8a" font-family="Consolas, monospace">POST .../{tagId}/block</text>
  <rect x="598" y="370" width="214" height="44" rx="22" fill="#fef3c7" stroke="#d97706"/>
  <text x="705" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">200 · Tag blocked</text>

  <rect x="850" y="110" width="270" height="330" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="882" cy="142" r="18" fill="#2563eb"/>
  <text x="882" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
  <text x="910" y="149" font-size="18" font-weight="bold" fill="#111">Someone finds it</text>
  <text x="868" y="195" font-size="14" fill="#333">A stranger tries to charge with</text>
  <text x="868" y="217" font-size="14" fill="#333">the lost tag. The charger asks</text>
  <text x="868" y="239" font-size="14" fill="#333">the API again.</text>
  <rect x="868" y="300" width="234" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="880" y="320" font-size="12" fill="#555">Verify</text>
  <text x="880" y="339" font-size="13" fill="#1e3a8a" font-family="Consolas, monospace">GET .../verify?tagId=</text>
  <rect x="868" y="370" width="234" height="44" rx="22" fill="#fee2e2" stroke="#dc2626"/>
  <text x="985" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">No · charging denied</text>

  <line x1="292" y1="275" x2="306" y2="275" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="562" y1="275" x2="576" y2="275" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="832" y1="275" x2="846" y2="275" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="40" y="475" font-size="13" fill="#666">Example tag id: dk-0123456789-clever</text>
</svg>
